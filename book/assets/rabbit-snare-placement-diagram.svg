<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Stopped rabbit snare placement diagram</title>
  <desc id="desc">A large working placement diagram for the emergency-only European-rabbit snare. The top view shows a loop centred across an open short-vegetation rabbit run, a rabbit travel arrow, the tether leaving the run and a peg outside it. Unbounded sweep arrows require the entire possible sweep around the peg to be clear without claiming a fixed radius. The side view shows an about ten centimetre loop with its bottom about nine centimetres above the ground, resting lightly in one notched support while the loop can lift free, plus a nearly flush peg. Six labelled rejection boxes cover burrows or fences, water or drops, roads or camps, pets or livestock, hare or native-animal signs and any object within reach.</desc>
  <defs>
    <style>
      .bg{fill:#fffefa}.panel{fill:#eaf5eb;stroke:#244a3c;stroke-width:3}.warn{fill:#fff0ed;stroke:#8c2f2b;stroke-width:3}.title{font:700 42px Arial,sans-serif;fill:#173f35}.status{font:700 24px Arial,sans-serif;fill:#77551c}.head{font:700 31px Arial,sans-serif;fill:#173f35}.label{font:700 28px Arial,sans-serif;fill:#173f35}.body{font:26px Arial,sans-serif;fill:#344c41}.small{font:24px Arial,sans-serif;fill:#344c41}.chipText{font:700 24px Arial,sans-serif;fill:#7a2926}.red{fill:#7a2926}.amber{fill:#7b5114}.wire{fill:none;stroke:#173f35;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.cord{fill:none;stroke:#173f35;stroke-width:5;stroke-linecap:round}.dim{fill:none;stroke:#8a5a10;stroke-width:4;marker-start:url(#arrow);marker-end:url(#arrow)}.measure{fill:none;stroke:#8a5a10;stroke-width:4;stroke-linecap:round}.sweep{fill:none;stroke:#8a5a10;stroke-width:3;stroke-dasharray:11 9;marker-end:url(#arrow)}.run{fill:none;stroke:#83998e;stroke-width:5;stroke-dasharray:13 10}.ground{stroke:#6e806f;stroke-width:6}.chip{fill:#fffefa;stroke:#8c2f2b;stroke-width:2}.footer{fill:#fff0ed}.foot{font:700 24px Arial,sans-serif;fill:#7a2926}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a10"/></marker>
  </defs>

  <rect class="bg" width="1000" height="1000"/>
  <text class="title" x="34" y="56">RABBIT SNARE — PLACEMENT</text>
  <text class="status" x="966" y="91" text-anchor="end">WORKING DIAGRAM · EMERGENCY GATE MUST PASS</text>

  <rect class="warn" x="34" y="112" width="932" height="90" rx="10"/>
  <text class="label red" x="58" y="150">OPEN, NEARBY EUROPEAN-RABBIT RUN ONLY · NOT TO SCALE</text>
  <text class="small" x="58" y="182">Set one on a short-vegetation run while awake and close.</text>

  <rect class="panel" x="34" y="222" width="932" height="292" rx="10"/>
  <text class="head" x="58" y="262">TOP VIEW — LOOP ACROSS RUN</text>
  <path class="run" d="M162 284 C132 346 136 410 158 462"/>
  <path class="run" d="M486 284 C516 346 512 410 490 462"/>
  <line class="dim" x1="324" y1="306" x2="324" y2="440"/>
  <text class="body amber" x="324" y="498" text-anchor="middle">RABBIT TRAVEL · BOTH WAYS</text>

  <line class="wire" x1="174" y1="386" x2="474" y2="386"/>
  <circle cx="474" cy="386" r="14" fill="#fffefa" stroke="#173f35" stroke-width="7"/>
  <path class="cord" d="M488 386 C574 386 594 324 690 324"/>
  <path class="cord" d="M690 310 L730 316 L720 360 L680 354 Z"/>
  <text class="label" x="324" y="356" text-anchor="middle">LOOP ACROSS RUN</text>
  <text class="body" x="815" y="300" text-anchor="middle">PEG OUTSIDE RUN</text>
  <path class="sweep" d="M706 310 C770 334 862 334 938 314"/>
  <path class="sweep" d="M730 350 C810 360 882 382 940 410"/>
  <text class="small red" x="755" y="438" text-anchor="middle">CLEAR ENTIRE POSSIBLE SWEEP</text>
  <text class="small red" x="790" y="466" text-anchor="middle">AROUND PEG</text>
  <text class="small red" x="790" y="494" text-anchor="middle">NO DRAG OR OBJECTS</text>

  <rect class="panel" x="34" y="534" width="932" height="272" rx="10"/>
  <text class="head" x="58" y="574">SIDE VIEW — HEIGHT + ONE NOTCHED SUPPORT</text>
  <line class="ground" x1="64" y1="752" x2="936" y2="752"/>
  <circle class="wire" cx="280" cy="656" r="62"/>
  <text class="label" x="280" y="650" text-anchor="middle">ABOUT</text>
  <text class="label" x="280" y="680" text-anchor="middle">10 cm</text>
  <path class="measure" d="M142 718 V752 M132 718 H152 M132 752 H152"/>
  <text class="small amber" x="250" y="792" text-anchor="middle">ABOUT 9 cm TO LOOP BOTTOM</text>

  <circle cx="342" cy="656" r="8" fill="#fffefa" stroke="#173f35" stroke-width="3"/>
  <path class="cord" d="M342 656 C480 658 530 710 690 728"/>
  <path class="cord" d="M690 718 L735 718 L733 760 L688 760 Z"/>
  <text class="body" x="500" y="638" text-anchor="middle">SHORT TETHER</text>
  <text class="small" x="712" y="792" text-anchor="middle">PEG TOP NEARLY FLUSH</text>

  <path class="cord" d="M438 752 L374 668 L342 656 L360 644"/>
  <text class="body" x="780" y="610" text-anchor="middle">ONE NOTCHED SUPPORT</text>
  <text class="small" x="780" y="642" text-anchor="middle">Loop rests lightly in notch.</text>
  <text class="small red" x="780" y="674" text-anchor="middle">Loop lifts free · support stays set.</text>
  <text class="small red" x="780" y="704" text-anchor="middle">Never tie loop to support.</text>

  <rect class="warn" x="34" y="812" width="932" height="120" rx="10"/>
  <text class="head red" x="58" y="847">REJECT THE SITE</text>
  <rect class="chip" x="58" y="860" width="275" height="30" rx="5"/>
  <rect class="chip" x="350" y="860" width="300" height="30" rx="5"/>
  <rect class="chip" x="664" y="860" width="279" height="30" rx="5"/>
  <rect class="chip" x="58" y="896" width="275" height="30" rx="5"/>
  <rect class="chip" x="350" y="896" width="300" height="30" rx="5"/>
  <rect class="chip" x="664" y="896" width="279" height="30" rx="5"/>
  <text class="chipText" x="70" y="884">× BURROW · FENCE</text>
  <text class="chipText" x="362" y="884">× WATER/STEEP DROP</text>
  <text class="chipText" x="674" y="884">× ROAD/TRACK/CAMP</text>
  <text class="chipText" x="70" y="920">× PET/STOCK ROUTE</text>
  <text class="chipText" x="362" y="920">× HARE/NATIVE SIGN</text>
  <text class="chipText" x="674" y="920">× OBJECT IN REACH</text>

  <rect class="footer" x="0" y="938" width="1000" height="62"/>
  <text class="foot" x="500" y="966" text-anchor="middle">MARK · WATCH · CHECK HOURLY</text>
  <text class="foot" x="500" y="993" text-anchor="middle">REMOVE BEFORE SLEEP / MOVE / BAD WEATHER / RESCUE</text>
</svg>
