<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">Four jobs, four layers</title><desc id="desc">Original working diagram. Read the adjoining instructions and limitations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#244a3c"/></marker></defs><rect width="900" height="530" fill="#fffefa"/><g font-family="Arial, sans-serif" fill="#22382d"><text x="32" y="44" font-size="28" font-weight="bold">Four jobs, four layers</text>
<rect x="95" y="104" width="710" height="65" fill="#dbe7e0" stroke="#244a3c" stroke-width="2"/>
<text x="125" y="144" font-size="25">1. Wind and rain barrier — breathing space open</text>
<rect x="130" y="197" width="640" height="65" fill="#e9d6a4" stroke="#7c6233" stroke-width="2"/>
<text x="160" y="237" font-size="25">2. Dry clothing / sleeping bag / blanket</text>
<rect x="165" y="290" width="570" height="65" fill="#c4cfb4" stroke="#496143" stroke-width="2"/>
<text x="195" y="330" font-size="25">3. Sleeping mat beneath the body</text>
<path d="M80 403H820" stroke="#686d61" stroke-width="8"/>
<text x="200" y="447" font-size="24">4. Groundsheet keeps ground moisture off</text>
<text x="135" y="485" font-size="20">A thin waterproof sheet is not a substitute for a mat.</text><text x="32" y="512" font-size="16" fill="#77551c">WORKING DIAGRAM • Not to scale • Read the warning and full instructions</text></g></svg>
