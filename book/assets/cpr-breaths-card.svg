<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
  <title id="title">CPR action card — Part 2: rescue breaths</title>
  <desc id="desc">Part two of a working Australian CPR card. It shows adult or child and infant airway and seal differences, one-second breaths that only make the chest rise, a single correction after a failed first breath, and an immediate return to thirty compressions.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0 L18 9 L0 18 Z" fill="#244a3c"/></marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0 L18 9 L0 18 Z" fill="#8c2f2b"/></marker>
    <style>
      .bg{fill:#fffefa}.box{fill:#f3f6f3;stroke:#244a3c;stroke-width:3}.warning{fill:#fff0ed;stroke:#8c2f2b;stroke-width:3}.caution{fill:#fff7e6;stroke:#8a5a10;stroke-width:3}.decision{fill:#eaf1f6;stroke:#244a3c;stroke-width:3}.path{fill:none;stroke:#244a3c;stroke-width:4;marker-end:url(#arrow)}.stopPath{fill:none;stroke:#8c2f2b;stroke-width:4;marker-end:url(#arrowRed)}.join{fill:none;stroke:#244a3c;stroke-width:4}.title{font:700 45px Arial,sans-serif;fill:#173f35}.head{font:700 30px Arial,sans-serif;fill:#173f35}.small{font:28px Arial,sans-serif;fill:#344c41}.branch{font:700 28px Arial,sans-serif;fill:#173f35}.red{fill:#7a2926}.amber{fill:#7b5114}
    </style>
  </defs>
  <rect class="bg" width="1000" height="1250"/>
  <text class="title" x="36" y="56">CPR — Part 2: give 2 rescue breaths</text>

  <rect class="warning" x="34" y="79" width="932" height="171" rx="10"/>
  <text class="head red" x="58" y="120">USE ONLY AFTER 30 COMPRESSIONS ON PART 1</text>
  <text class="small" x="58" y="161">Follow 000. Give breaths only if trained and willing.</text>
  <text class="small" x="58" y="199">If unable or unwilling, return to Part 1 and keep compressing.</text>
  <text class="small" x="58" y="237">Do not delay compressions to find a breathing barrier.</text>

  <rect class="box" x="34" y="278" width="448" height="218" rx="10"/>
  <text class="head" x="58" y="319">ADULT OR CHILD AGED 1+</text>
  <text class="small" x="58" y="361">Tilt the head and lift the chin.</text>
  <text class="small" x="58" y="397">Pinch the nose. Seal your mouth</text>
  <text class="small" x="58" y="433">over the person's mouth.</text>
  <text class="small" x="58" y="469">Do not press under the chin.</text>
  <rect class="box" x="518" y="278" width="448" height="218" rx="10"/>
  <text class="head" x="542" y="319">INFANT UNDER 1</text>
  <text class="small" x="542" y="361">Keep the head neutral.</text>
  <text class="small" x="542" y="397">Seal your mouth over the infant's</text>
  <text class="small" x="542" y="433">mouth and nose.</text>
  <text class="small" x="542" y="469">Use just enough air for chest rise.</text>

  <path class="path" d="M500 496 V524"/>
  <rect class="box" x="66" y="536" width="868" height="126" rx="10"/>
  <text class="head" x="92" y="577">1  GIVE THE FIRST BREATH</text>
  <text class="small" x="92" y="619">About 1 second; use only enough air to make the chest rise.</text>
  <path class="path" d="M500 662 V690"/>

  <rect class="decision" x="66" y="702" width="868" height="94" rx="10"/>
  <text class="head" x="92" y="743">DID THE CHEST RISE?</text>
  <text class="small" x="475" y="743">Choose NO if unsure.</text>
  <path class="path" d="M330 796 V830"/>
  <text class="branch" x="300" y="822" text-anchor="end">YES</text>
  <path class="stopPath" d="M670 796 V830"/>
  <text class="branch red" x="700" y="822">NO / UNSURE</text>

  <rect class="box" x="34" y="843" width="448" height="160" rx="10"/>
  <text class="head" x="58" y="884">GIVE THE SECOND BREATH</text>
  <text class="small" x="58" y="926">Again: about 1 second and only</text>
  <text class="small" x="58" y="961">enough air for chest rise.</text>
  <rect class="warning" x="518" y="843" width="448" height="160" rx="10"/>
  <text class="head red" x="542" y="884">CORRECT ONCE</text>
  <text class="small" x="542" y="926">Correct head position and seal.</text>
  <text class="small" x="542" y="961">Remove only visible material.</text>
  <text class="small" x="542" y="996">Try the second breath once.</text>

  <path class="join" d="M258 1003 V1030 H742 V1003"/>
  <path class="path" d="M500 1030 V1052"/>
  <rect class="caution" x="66" y="1064" width="868" height="117" rx="10"/>
  <text class="head amber" x="92" y="1105">RETURN IMMEDIATELY TO 30 COMPRESSIONS</text>
  <text class="small" x="92" y="1147">Use Part 1. If an AED arrives, use it at once and follow its prompts.</text>

  <rect x="0" y="1214" width="1000" height="36" fill="#fff7e6"/>
  <text x="964" y="1239" text-anchor="end" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#77551c">WORKING DRAFT — Part 2 of 2; clinical and stressed-reader review outstanding</text>
</svg>
