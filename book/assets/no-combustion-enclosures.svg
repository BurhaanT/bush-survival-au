<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">Never burn fuel inside an enclosure</title>
  <desc id="desc">Working prohibition diagram. Do not use a stove, fuel heater, lantern, charcoal barbecue, candle, or a vehicle engine or exhaust for heat inside a tent, bivvy, swag, vehicle, or enclosed or partly enclosed shelter. Opening a flap, door, or window does not make indoor burning safe. This diagram does not approve any outdoor equipment setup.</desc>
  <rect width="1200" height="1020" fill="#fffefa"/>
  <g font-family="Arial, sans-serif" fill="#22382d">
    <text x="48" y="62" font-size="44" font-weight="700">Never burn fuel inside an enclosure</text>
    <text x="48" y="105" font-size="25">Carbon monoxide can poison without smell. Heat and flame can start a fire.</text>

    <g aria-label="Enclosures covered by this prohibition">
      <rect x="48" y="145" width="344" height="245" rx="12" fill="#eef3ef" stroke="#244a3c" stroke-width="3"/>
      <text x="220" y="181" font-size="27" font-weight="700" text-anchor="middle">TENT • BIVVY • SWAG</text>
      <path d="M95 318 L220 205 L345 318 Z" fill="none" stroke="#244a3c" stroke-width="8" stroke-linejoin="round"/>
      <path d="M220 205V318" fill="none" stroke="#244a3c" stroke-width="5"/>
      <path d="M135 338 Q220 283 305 338" fill="none" stroke="#68766c" stroke-width="7" stroke-linecap="round"/>
      <rect x="68" y="345" width="304" height="30" rx="15" fill="#a52a2a"/>
      <text x="220" y="367" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">NO FUEL BURNING INSIDE</text>

      <rect x="428" y="145" width="344" height="245" rx="12" fill="#eef3ef" stroke="#244a3c" stroke-width="3"/>
      <text x="600" y="181" font-size="27" font-weight="700" text-anchor="middle">VEHICLE</text>
      <path d="M479 282 L515 222 H679 L725 282 V326 H479 Z" fill="none" stroke="#244a3c" stroke-width="8" stroke-linejoin="round"/>
      <path d="M531 225 L548 280 H653 L674 225" fill="none" stroke="#68766c" stroke-width="5"/>
      <circle cx="535" cy="326" r="24" fill="#fffefa" stroke="#244a3c" stroke-width="8"/>
      <circle cx="674" cy="326" r="24" fill="#fffefa" stroke="#244a3c" stroke-width="8"/>
      <rect x="448" y="345" width="304" height="30" rx="15" fill="#a52a2a"/>
      <text x="600" y="367" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">NO FUEL BURNING INSIDE</text>

      <rect x="808" y="145" width="344" height="245" rx="12" fill="#eef3ef" stroke="#244a3c" stroke-width="3"/>
      <text x="980" y="178" font-size="25" font-weight="700" text-anchor="middle">ENCLOSED OR PARTLY</text>
      <text x="980" y="208" font-size="25" font-weight="700" text-anchor="middle">ENCLOSED SHELTER</text>
      <path d="M850 242 H1110 M875 242 V331 M1085 242 V331" fill="none" stroke="#244a3c" stroke-width="8" stroke-linecap="round"/>
      <path d="M875 331 H1085" fill="none" stroke="#68766c" stroke-width="5" stroke-dasharray="14 10"/>
      <text x="980" y="284" font-size="20" text-anchor="middle">awning • bothy</text>
      <text x="980" y="311" font-size="20" text-anchor="middle">improvised shelter</text>
      <rect x="828" y="345" width="304" height="30" rx="15" fill="#a52a2a"/>
      <text x="980" y="367" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">NO FUEL BURNING INSIDE</text>
    </g>

    <text x="48" y="435" font-size="29" font-weight="700">These sources of combustion or heat are not indoor shelter heaters:</text>

    <g aria-label="Prohibited equipment and engine-heating concepts">
      <g>
        <rect x="48" y="465" width="344" height="130" rx="10" fill="#fff7f2" stroke="#8f3a32" stroke-width="3"/>
        <rect x="82" y="509" width="74" height="50" rx="6" fill="none" stroke="#22382d" stroke-width="6"/>
        <circle cx="103" cy="525" r="7" fill="none" stroke="#22382d" stroke-width="4"/>
        <circle cx="135" cy="525" r="7" fill="none" stroke="#22382d" stroke-width="4"/>
        <text x="280" y="541" font-size="28" font-weight="700" text-anchor="middle">NO — STOVE</text>
        <path d="M70 487 L171 575" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
      </g>
      <g>
        <rect x="428" y="465" width="344" height="130" rx="10" fill="#fff7f2" stroke="#8f3a32" stroke-width="3"/>
        <rect x="461" y="500" width="86" height="66" rx="8" fill="none" stroke="#22382d" stroke-width="6"/>
        <path d="M478 518H530 M478 534H530 M478 550H530" stroke="#22382d" stroke-width="4"/>
        <text x="655" y="528" font-size="26" font-weight="700" text-anchor="middle">NO — FUEL</text>
        <text x="655" y="560" font-size="26" font-weight="700" text-anchor="middle">HEATER</text>
        <path d="M450 487 L558 575" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
      </g>
      <g>
        <rect x="808" y="465" width="344" height="130" rx="10" fill="#fff7f2" stroke="#8f3a32" stroke-width="3"/>
        <path d="M845 519 Q886 478 927 519" fill="none" stroke="#22382d" stroke-width="6"/>
        <rect x="855" y="519" width="62" height="48" rx="8" fill="none" stroke="#22382d" stroke-width="6"/>
        <text x="1040" y="541" font-size="24" font-weight="700" text-anchor="middle">NO — LANTERN</text>
        <path d="M830 487 L934 575" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
      </g>

      <g>
        <rect x="48" y="620" width="344" height="130" rx="10" fill="#fff7f2" stroke="#8f3a32" stroke-width="3"/>
        <path d="M83 662 H157 Q153 707 120 707 Q87 707 83 662 Z" fill="none" stroke="#22382d" stroke-width="6"/>
        <path d="M120 707V724 M99 724H141" stroke="#22382d" stroke-width="6" stroke-linecap="round"/>
        <text x="282" y="678" font-size="22" font-weight="700" text-anchor="middle">NO — CHARCOAL</text>
        <text x="282" y="710" font-size="24" font-weight="700" text-anchor="middle">OR BBQ</text>
        <path d="M70 642 L168 730" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
      </g>
      <g>
        <rect x="428" y="620" width="344" height="130" rx="10" fill="#fff7f2" stroke="#8f3a32" stroke-width="3"/>
        <rect x="476" y="660" width="45" height="62" rx="5" fill="none" stroke="#22382d" stroke-width="6"/>
        <path d="M498 649V660" stroke="#22382d" stroke-width="5" stroke-linecap="round"/>
        <text x="655" y="697" font-size="24" font-weight="700" text-anchor="middle">NO — CANDLE</text>
        <path d="M450 642 L542 730" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
      </g>
      <g>
        <rect x="808" y="620" width="344" height="130" rx="10" fill="#fff7f2" stroke="#8f3a32" stroke-width="3"/>
        <path d="M843 683 L868 655 H922 L942 676 V714 H843 Z" fill="none" stroke="#22382d" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="868" cy="714" r="12" fill="#fffefa" stroke="#22382d" stroke-width="5"/>
        <circle cx="920" cy="714" r="12" fill="#fffefa" stroke="#22382d" stroke-width="5"/>
        <text x="1042" y="658" font-size="18" font-weight="700" text-anchor="middle">NO ENGINE</text>
        <text x="1042" y="684" font-size="18" font-weight="700" text-anchor="middle">OR EXHAUST</text>
        <text x="1042" y="710" font-size="18" font-weight="700" text-anchor="middle">FOR HEAT INSIDE</text>
        <path d="M830 642 L951 730" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
      </g>
    </g>

    <rect x="48" y="785" width="1104" height="88" rx="10" fill="#a52a2a"/>
    <text x="600" y="822" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Opening a flap, door or window does not make</text>
    <text x="600" y="856" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">indoor burning safe.</text>

    <text x="48" y="916" font-size="24" font-weight="700">Outdoor equipment is not approved by this card.</text>
    <text x="48" y="950" font-size="23">The exact manual, current fire law and suitable conditions still control.</text>
    <text x="48" y="992" font-size="18" fill="#77551c">WORKING DIAGRAM • PROHIBITION ONLY • INDEPENDENT REVIEW OUTSTANDING</text>
  </g>
</svg>
