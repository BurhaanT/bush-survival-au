<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">CPR: the repeating action</title><desc id="desc">Original working diagram. Read the adjoining instructions and limitations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#244a3c"/></marker></defs><rect width="900" height="550" fill="#fffefa"/><g font-family="Arial, sans-serif" fill="#22382d"><text x="32" y="44" font-size="28" font-weight="bold">CPR: the repeating action</text>
<rect x="65" y="90" width="770" height="70" rx="8" fill="#f4e3bd" stroke="#896826" stroke-width="2"/><text x="450" y="120" text-anchor="middle" font-size="23">Unresponsive and not breathing normally</text><text x="450" y="147" text-anchor="middle" font-size="20">Call 000 • Speakerphone • Send another helper for an AED</text>
<path d="M450 160V197" stroke="#244a3c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="200" y="207" width="500" height="86" rx="8" fill="#dbe7e0" stroke="#244a3c" stroke-width="2"/><text x="450" y="240" text-anchor="middle" font-size="25" font-weight="bold">30 chest compressions</text><text x="450" y="273" text-anchor="middle" font-size="22">Rate: 100–120 per minute • Let chest rise</text>
<path d="M450 293V333" stroke="#244a3c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="200" y="343" width="500" height="86" rx="8" fill="#edf1e8" stroke="#244a3c" stroke-width="2"/><text x="450" y="377" text-anchor="middle" font-size="25" font-weight="bold">2 breaths, if trained and willing</text><text x="450" y="409" text-anchor="middle" font-size="21">Otherwise keep giving compressions</text>
<path d="M200 386H125V250H192" stroke="#244a3c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="70" y="320" font-size="20" transform="rotate(-90 70 320)">Repeat</text>
<text x="450" y="477" text-anchor="middle" font-size="22">Use an AED as soon as available. Follow its prompts.</text>
<text x="450" y="510" text-anchor="middle" font-size="19">Scene danger and life-threatening bleeding are addressed in the text.</text><text x="32" y="532" font-size="16" fill="#77551c">WORKING DIAGRAM • Not to scale • Read the warning and full instructions</text></g></svg>
