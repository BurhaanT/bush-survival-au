<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Three-strand plait: alternate sides</title><desc id="desc">Original working diagram. Read the adjoining instructions and limitations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#244a3c"/></marker></defs><rect width="900" height="540" fill="#fffefa"/><g font-family="Arial, sans-serif" fill="#22382d"><text x="32" y="44" font-size="28" font-weight="bold">Three-strand plait: alternate sides</text>
<text x="50" y="95" font-size="22">Start with three strands secured together.</text>
<text x="115" y="155" font-size="25">A</text><text x="225" y="155" font-size="25">B</text><text x="335" y="155" font-size="25">C</text>
<path d="M240 180 C240 225 130 225 130 280" fill="none" stroke="#ad7032" stroke-width="13"/>
<path d="M350 180V280" fill="none" stroke="#4e7794" stroke-width="13"/>
<path d="M130 180 C130 225 240 225 240 280" fill="none" stroke="#fffefa" stroke-width="22"/>
<path d="M130 180 C130 225 240 225 240 280" fill="none" stroke="#315641" stroke-width="13"/>
<text x="440" y="216" font-size="24" font-weight="bold">1. Left OVER middle</text><text x="440" y="251" font-size="22">A becomes the middle strand.</text>
<path d="M130 280V390" fill="none" stroke="#ad7032" stroke-width="13"/>
<path d="M240 280 C240 325 350 325 350 390" fill="none" stroke="#315641" stroke-width="13"/>
<path d="M350 280 C350 325 240 325 240 390" fill="none" stroke="#fffefa" stroke-width="22"/>
<path d="M350 280 C350 325 240 325 240 390" fill="none" stroke="#4e7794" stroke-width="13"/>
<text x="440" y="326" font-size="24" font-weight="bold">2. Right OVER new middle</text><text x="440" y="361" font-size="22">C becomes the middle strand.</text>
<text x="115" y="426" font-size="25">B</text><text x="225" y="426" font-size="25">C</text><text x="335" y="426" font-size="25">A</text>
<text x="440" y="426" font-size="22">Repeat left, right, left, right.</text>
<text x="50" y="485" font-size="21">Keep tension even. Tie the end. For light, non-critical ties only.</text><text x="32" y="522" font-size="16" fill="#77551c">WORKING DIAGRAM • Not to scale • Read the warning and full instructions</text></g></svg>
