name: Deploy book reader to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: reader/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Report Pages target and visibility
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORTED_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPORTED_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"
          pages_public="$(jq -er 'if (has("public") and (.public | type == "boolean")) then (.public | tostring) else error("missing or invalid Pages public flag") end' <<<"$response")"
          echo "::notice::Pages target is '$REPORTED_PAGES_BASE_URL' with base path '${REPORTED_PAGES_BASE_PATH:-/}'."
          if [[ "$pages_public" == "true" ]]; then
            echo "::warning::GitHub reports this Pages site as publicly accessible. The explicit PUBLISH_BOOK_READER=YES repository variable authorises deployment of the reviewed static bundle to this public target."
          else
            echo "::notice::GitHub reports this Pages site as private to authorised repository readers."
          fi

      - name: Install locked dependencies
        working-directory: reader
        run: npm ci

      - name: Verify reader source
        working-directory: reader
        run: npm test && npm run check

      - name: Build static book reader
        working-directory: reader
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:pages

      - name: Verify static deployment artifact
        working-directory: reader
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run check:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: reader/dist-pages

  deploy:
    if: ${{ vars.PUBLISH_BOOK_READER == 'YES' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
